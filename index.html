<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMPACT FESTIVAL Hallenplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand header, map stage left with zone panel docked right; zone index below. Stacks on phones, map scrolls sideways. */
:root{
  --bg:#F4F8F7; --surface:#FFFFFF; --surface-2:#EAF4F0; --line:#D7E3DF;
  --fg:#122C42; --muted:#4F6675; --accent:#2E8F72; --mint:#64DBB0; --petrol:#002D42;
  --hot:rgba(100,219,176,.38); --hot-strong:rgba(100,219,176,.6);
  --c-stage:#002D42; --c-net:#2E8F72; --c-expo:#6B7C8C; --c-food:#C9822B; --c-fest:#4E9A55; --c-svc:#E4573D;
  --font:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow:0 10px 30px -18px rgba(0,45,66,.45); --on:#002D42; --on-fg:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071F2C; --surface:#0C2A3A; --surface-2:#103447; --line:#1B4458;
  --fg:#EAF4F1; --muted:#A3BCC6; --accent:#64DBB0; --mint:#64DBB0; --petrol:#002D42;
  --c-stage:#2F6F95; --c-expo:#5D7385; --on:#64DBB0; --on-fg:#002D42; --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071F2C; --surface:#0C2A3A; --surface-2:#103447; --line:#1B4458;
  --fg:#EAF4F1; --muted:#A3BCC6; --accent:#64DBB0; --mint:#64DBB0; --petrol:#002D42;
  --c-stage:#2F6F95; --c-expo:#5D7385; --on:#64DBB0; --on-fg:#002D42; --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.brand{display:flex;flex-direction:column;gap:12px}
.logo{height:56px;width:auto;align-self:flex-start;max-width:100%;object-fit:contain}
.logo.dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.light{display:none}:root:not([data-theme="light"]) .logo.dark{display:block}}
:root[data-theme="dark"] .logo.light{display:none} :root[data-theme="dark"] .logo.dark{display:block}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.meta span{font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--fg))}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.chip:focus-visible,.hz:focus-visible,.zrow:focus-visible,.btn:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mapscroll svg{display:block;width:100%;min-width:720px;height:auto}
.hint{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.hs{fill:transparent;stroke:transparent;stroke-width:3;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.hz:hover .hs,.hz.hover .hs{fill:var(--hot);stroke:var(--mint)}
.hz.active .hs{fill:var(--hot-strong);stroke:#fff;stroke-width:2.5}
.hz{outline:none}
.pin{cursor:pointer;transition:transform .15s}
.pin circle.ring{fill:#fff}
.pin text{font-family:var(--font);font-weight:700;font-size:30px;fill:#fff;pointer-events:none}
.pin.active circle.ring{fill:var(--mint)}
.dim{opacity:.18}
.dim .hs{pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px)}
@media (max-width:980px){.panel{position:static}}
.ph{aspect-ratio:16/10;width:100%;max-width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.ph-empty{aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--surface-2),var(--bg));color:var(--muted);font-size:13px}
.ph-empty svg{width:64px;height:64px}
.pbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--c);padding:4px 10px;border-radius:999px}
.panel h2{margin:0;font-size:22px;line-height:1.2}
.panel p{margin:0;color:var(--muted)}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.panel li{display:flex;gap:10px;font-size:14px}
.panel li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-top:8px}
.nav{display:flex;gap:8px;padding-top:4px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);flex:1}
.btn.primary{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.index h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.zrow{font:inherit;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.zrow b{font-weight:600;font-size:14px;display:block;line-height:1.3}
.zrow small{color:var(--muted);font-size:12px}
.zrow .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;background:var(--c)}
.zrow[aria-current="true"]{border-color:var(--accent);background:var(--surface-2)}
.zrow.dim{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const NS="http://www.w3.org/2000/svg";
const $=s=>document.querySelector(s);
const hot=$("#hot"), pins=$("#pins"), panel=$("#panel"), zlist=$("#zlist"), filters=$("#filters");
let active=null, filter="all";
const cssVar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

ZONES.forEach(z=>{
  const g=document.createElementNS(NS,"g"); g.classList.add("hz"); g.dataset.id=z.id;
  g.setAttribute("tabindex","0"); g.setAttribute("role","button"); g.setAttribute("aria-label",z.name);
  HOT.hs[z.id].forEach(poly=>{
    const p=document.createElementNS(NS,"polygon"); p.classList.add("hs");
    p.setAttribute("points",poly.map(q=>q.join(",")).join(" ")); g.appendChild(p);
  });
  hot.appendChild(g);
  const [x,y]=HOT.pins[z.id];
  const pg=document.createElementNS(NS,"g"); pg.classList.add("pin"); pg.dataset.id=z.id;
  pg.innerHTML=`<circle class="ring" cx="${x}" cy="${y-48}" r="30"/><circle class="dot" cx="${x}" cy="${y-48}" r="24" style="fill:var(${CATS[z.cat].c})"/><text x="${x}" y="${y-37.5}" text-anchor="middle">${z.n}</text><path d="M${x-9} ${y-22} L${x} ${y-4} L${x+9} ${y-22}Z" fill="#fff"/>`;
  pins.appendChild(pg);
  [g,pg].forEach(el=>{
    el.addEventListener("click",()=>select(z.id,true));
    el.addEventListener("mouseenter",()=>hover(z.id,true));
    el.addEventListener("mouseleave",()=>hover(z.id,false));
  });
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(z.id,true)}});

  const b=document.createElement("button"); b.className="zrow"; b.id="row-"+z.id; b.dataset.id=z.id;
  b.style.setProperty("--c",`var(${CATS[z.cat].c})`);
  b.innerHTML=`<span class="num">${z.n}</span><span><b>${z.name}</b><small>${CATS[z.cat].label}</small></span>`;
  b.addEventListener("click",()=>{select(z.id,true);$("#map").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"})});
  b.addEventListener("mouseenter",()=>hover(z.id,true)); b.addEventListener("mouseleave",()=>hover(z.id,false));
  zlist.appendChild(b);
});

function hover(id,on){document.querySelectorAll(`.hz[data-id="${id}"]`).forEach(g=>g.classList.toggle("hover",on))}

const ICON={svc:'<path d="M12 40V12h22M26 4l10 8-10 8M40 22v20" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  food:'<path d="M10 22h26v6a13 13 0 0 1-26 0zM36 24h4a5 5 0 0 1 0 10h-5M15 6c-2 3 2 5 0 9M23 6c-2 3 2 5 0 9M31 6c-2 3 2 5 0 9" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'};

function render(z){
  const c=`var(${CATS[z.cat].c})`;
  const media = PHOTOS[z.id]
    ? `<img class="ph" alt="Impression: ${z.name}" src="${PHOTOS[z.id]}">`
    : `<div class="ph-empty"><svg viewBox="0 0 48 48" aria-hidden="true">${ICON[z.cat]||ICON.svc}</svg></div>`;
  const i=ZONES.indexOf(z);
  panel.innerHTML = `${media}<div class="pbody" style="--c:${c}">
    <span class="tag">${CATS[z.cat].label}</span>
    <h2>${z.n}. ${z.name}</h2>
    <p>${z.text}</p>
    <ul>${z.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
    <div class="nav"><button class="btn" id="prev">← ${ZONES[(i+ZONES.length-1)%ZONES.length].name}</button><button class="btn primary" id="next">${ZONES[(i+1)%ZONES.length].name} →</button></div>
  </div>`;
  $("#prev").onclick=()=>select(ZONES[(i+ZONES.length-1)%ZONES.length].id,true);
  $("#next").onclick=()=>select(ZONES[(i+1)%ZONES.length].id,true);
}

function select(id,push){
  const z=ZONES.find(q=>q.id===id); if(!z) return;
  active=id;
  document.querySelectorAll(".hz,.pin").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  document.querySelectorAll(".zrow").forEach(el=>el.setAttribute("aria-current",el.dataset.id===id?"true":"false"));
  // bring active pin on top
  const pin=pins.querySelector(`.pin[data-id="${id}"]`); pins.appendChild(pin);
  render(z);
  if(push && location.hash!=="#"+id){ try{history.replaceState(null,"","#"+id)}catch(e){} }
}

function applyFilter(){
  ZONES.forEach(z=>{
    const off = filter!=="all" && z.cat!==filter;
    document.querySelectorAll(`[data-id="${z.id}"]`).forEach(el=>{ if(!el.classList.contains("chip")) el.classList.toggle("dim",off)});
  });
  filters.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter?"true":"false"));
}
[["all","Alle Bereiche","--fg"],...Object.entries(CATS).map(([k,v])=>[k,v.label,v.c])].forEach(([k,l,c])=>{
  const b=document.createElement("button"); b.className="chip"; b.dataset.f=k;
  b.innerHTML=`<i style="--c:var(${c})"></i>${l}`;
  b.onclick=()=>{filter=(filter===k&&k!=="all")?"all":k; applyFilter();
    if(filter!=="all"){const first=ZONES.find(z=>z.cat===filter); if(first && (ZONES.find(z=>z.id===active)||{}).cat!==filter) select(first.id,true)}};
  filters.appendChild(b);
});
applyFilter();

function fromHash(){const id=location.hash.slice(1); select(ZONES.some(z=>z.id===id)?id:"impact-stage",false)}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
